<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Under Construction</title>
  <meta name="description" content="This site is under construction." />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚧</text></svg>" />
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #008080;
      color: #000;
      font-family: "Times New Roman", Times, serif;
      min-height: 100vh;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image:
        repeating-linear-gradient(45deg, rgba(0,0,0,0.04) 0 2px, transparent 2px 8px);
    }

    .frame {
      background: #c0c0c0;
      border: 3px ridge #dfdfdf;
      padding: 56px 64px;
      box-shadow: 6px 6px 0 #000;
      text-align: center;
    }

    h1 {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 2rem;
      font-weight: bold;
      letter-spacing: 0.02em;
      color: #000;
      margin: 0 0 40px;
    }

    .stats {
      font-family: "Courier New", Courier, monospace;
      font-size: 0.9rem;
      color: #000080;
      margin: 0;
    }
    .counter {
      display: inline-block;
      background: #000;
      color: #00ff00;
      padding: 4px 10px;
      letter-spacing: 0.18em;
      border: 1px inset #808080;
      margin-left: 6px;
    }
  </style>
</head>
<body>
  <div class="frame">
    <h1>UNDER CONSTRUCTION</h1>
    <p class="stats">
      Visitors: <span class="counter" id="hit-counter">--------</span>
    </p>
  </div>
  <script>
    (function () {
      var el = document.getElementById('hit-counter');
      if (!el) return;
      var endpoints = [
        'https://abacus.jasoncameron.dev/hit/mishaevans-com/visits',
        'https://api.counterapi.dev/v1/mishaevans-com/visits/up'
      ];
      function pad(n) { return String(n).padStart(8, '0'); }
      function tryNext(i) {
        if (i >= endpoints.length) { el.textContent = '00000000'; return; }
        fetch(endpoints[i], { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
          .then(function (d) {
            var n = d.value || d.count || (d.data && d.data.up_count) || 0;
            el.textContent = pad(n);
          })
          .catch(function () { tryNext(i + 1); });
      }
      tryNext(0);
    })();
  </script>
</body>
</html>
