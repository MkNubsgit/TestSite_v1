<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Under Construction</title>
  <meta name="description" content="This site is under construction." />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚧</text></svg>" />
  <style>
    :root {
      --bg: #0e0f13;
      --fg: #e6e7ea;
      --muted: #9aa0a6;
      --accent: #7c5cff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Inter, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      line-height: 1.5;
      overflow: hidden;
    }
    .glow {
      position: fixed; inset: -20%;
      background: radial-gradient(closest-side, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%);
      filter: blur(40px);
      pointer-events: none;
      animation: drift 12s ease-in-out infinite alternate;
    }
    @keyframes drift {
      to { transform: translate(40px, -20px) scale(1.05); }
    }
    main { position: relative; max-width: 480px; }
    .badge {
      display: inline-block;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      border: 1px solid color-mix(in srgb, var(--muted) 30%, transparent);
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 24px;
    }
    h1 {
      font-size: clamp(2rem, 6vw, 3rem);
      margin: 0 0 12px;
      letter-spacing: -0.02em;
      background: linear-gradient(120deg, var(--fg), var(--accent) 90%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    p { color: var(--muted); margin: 0; }
    .dots::after {
      display: inline-block;
      content: "";
      animation: dots 1.4s steps(4, end) infinite;
    }
    @keyframes dots {
      0%   { content: ""; }
      25%  { content: "."; }
      50%  { content: ".."; }
      75%  { content: "..."; }
    }
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <main>
    <span class="badge">Coming soon</span>
    <h1>Under construction</h1>
    <p>Something new is being built<span class="dots"></span></p>
  </main>
</body>
</html>
